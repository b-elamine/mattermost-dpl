apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: mattermost-operator
spec: 
  replicas: 1
  selector:
    matchLabels: 
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec: 
      containers:
        - name: minio
          image:  quay.io/minio/aistor/minio
          args: ["server", "/data"]
          envFrom:
            - secretRef:
                name: minio-credentials
          ports:
            - containerPort: 9000


---

apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: mattermost-operator
spec:
  selector:
    app: minio
  ports: 
    - port: 9000