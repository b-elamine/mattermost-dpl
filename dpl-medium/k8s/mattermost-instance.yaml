apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: mattermost
  namespace: mattermost-operator
spec:
  replicas: 4
  ingress:
    enabled: true
    host: mattermost.local
    tlsSecret: mattermost-tls
  database:
    external:
      secret: mattermost-db-connection
  fileStore:
    external:
      url: minio:9000
      bucket: mattermost
      secret: mattermost-filestore-connection
  # OpenSearch (k8s/opensearch-cluster.yaml) tourne mais n'est pas branché ici :
  # fonction "Enterprise search" désactivée sans licence Mattermost. Recherche
  # par défaut (Postgres) utilisée à la place. Voir NOTES.md.
  mattermostEnv:
    - name: MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER
      value: "http://mattermost-push-proxy:8066"
    - name: MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS
      value: "true"