- name: Common setup all nodes
  hosts: control_plane_init:control_plane_extra:workers
  become: true

  tasks:
    - name: install ocntainerd
      apt: 
        name: containerd
        state: present
        update_cache: true
    
    - name: Disable swap
      command: swapoff -a
      changed_when: false

    - name: remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: 'swap'
        state: absent
    
    - name: install conntrack
      apt:
        name: conntrack
        state: present
    
    - name: Load the br_netfilter kernel module
      modprobe:
        name: br_netfilter
        state: present

    - name: Persist br_netfilter across reboots
      lineinfile:
        path: /etc/modules-load.d/k8s.conf
        line: 'br_netfilter'
        create: true

    - name: enable ip forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true

    - name: enable bridge-nf-call-iptables
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: "1"
        sysctl_set: true

    - name: enable bridge-nf-call-ip6tables
      sysctl:
        name: net.bridge.bridge-nf-call-ip6tables
        value: "1"
        sysctl_set: true

    - name: Enable ip forwarding permanently
      lineinfile:
        path: /etc/sysctl.conf
        line: 'net.ipv4.ip_forward = 1'

    - name: Enable bridge-nf-call-iptables permanently
      lineinfile:
        path: /etc/sysctl.conf
        line: 'net.bridge.bridge-nf-call-iptables = 1'

    - name: Enable bridge-nf-call-ip6tables permanently
      lineinfile:
        path: /etc/sysctl.conf
        line: 'net.bridge.bridge-nf-call-ip6tables = 1'
    
    - name: Install k8s apt prerequisites
      apt:
        name: [apt-transport-https, ca-certificates, curl, gpg]
        state: present
    
    - name: download k8s gpg key
      shell: curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add the Kubernetes repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /"
        state: present
        filename: kubernetes

    - name: Install kubelet, kubeadm, kubectl
      apt:
        name: [kubelet, kubeadm, kubectl]
        state: present
        update_cache: true

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]


- name: intializing first controleplane
  hosts: control_plane_init
  become: true

  tasks:
    - name: Run kubeadm init
      command: >
         kubeadm init --control-plane-endpoint={{ ansible_host }}:6443 --upload-certs --pod-network-cidr=10.244.0.0/16
      args: 
        creates: /etc/kubernetes/admin.conf
    
    - name: create .kube folde for user
      file: 
        path: /home/belamine/.kube
        state: directory
        owner: belamine
        mode: "0755"
    
    - name: copy the admin kubeconfig
      copy: 
        src: /etc/kubernetes/admin.conf
        dest: /home/belamine/.kube/config
        remote_src: true
        owner: belamine
        mode: "0600"
    
    - name: Deploy Flannel
      command: kubectl --kubeconfig=/home/belamine/.kube/config apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml

    - name: Get the worker join command
      command: kubeadm token create --print-join-command
      register: worker_join_command
      changed_when: false

    - name: Generate a fresh certificate key for control-plane joins
      command: kubeadm init phase upload-certs --upload-certs
      register: cert_key_output
      changed_when: false

- name: Join the extra control-plane nodes
  hosts: control_plane_extra
  become: true
  vars:
    join_cmd: "{{ hostvars[groups['control_plane_init'][0]]['worker_join_command']['stdout'] }}"
    cert_key: "{{ hostvars[groups['control_plane_init'][0]]['cert_key_output']['stdout_lines'][-1] }}"

  tasks:
    - name: kubeadm join as control-plane
      command: "{{ join_cmd }} --control-plane --certificate-key {{ cert_key }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Join the worker nodes
  hosts: workers
  become: true
  vars:
    join_cmd: "{{ hostvars[groups['control_plane_init'][0]]['worker_join_command']['stdout'] }}"

  tasks:
    - name: kubeadm join as worker
      command: "{{ join_cmd }}"
      args:
        creates: /etc/kubernetes/kubelet.conf

- name: Install Helm and deploy Mattermost operator
  hosts: control_plane_init
  become: true

  tasks:
    - name: Download the Helm install script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3.sh
        mode: "0755"

    - name: Install Helm
      command: /tmp/get-helm-3.sh
      args:
        creates: /usr/local/bin/helm

    - name: Add the Mattermost Helm repository
      command: helm repo add mattermost https://helm.mattermost.com
      become_user: belamine
      changed_when: false

    - name: Update Helm repositories
      command: helm repo update
      become_user: belamine
      changed_when: false

    - name: Copy Mattermost Helm values file
      copy:
        src: /home/belamine/Desktop/Work/projects/mattermost-dpl/dpl-medium/k8s/mattermost-values.yaml
        dest: /home/belamine/mattermost-values.yaml
        mode: "0644"

    - name: Install the Mattermost operator via Helm
      command: >
        helm install mattermost-operator mattermost/mattermost-operator
        -n mattermost-operator --create-namespace -f /home/belamine/mattermost-values.yaml
      become_user: belamine
      register: helm_result
      failed_when: helm_result.rc != 0 and 'cannot re-use' not in helm_result.stderr
      changed_when: helm_result.rc == 0

    #Bricolage (transfère des fichers yaml k8s, execution manuelle sur le cluster)
    - name: Copy Mattermost custom resource
      copy:
        src: /home/belamine/Desktop/Work/projects/mattermost-dpl/dpl-medium/k8s/mattermost-instance.yaml
        dest: /home/belamine/mattermost-instance.yaml
        mode: "0644"
